<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>MorseReader ITA2 Test Signal</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      padding: max(1rem, env(safe-area-inset-top)) 1rem
               max(1rem, env(safe-area-inset-bottom));
      text-align: center;
    }

    .warning {
      width: min(58rem, 100%);
      padding: 1rem 1.25rem;
      border: 3px solid #ffcc00;
      border-radius: 0.8rem;
      background: #342900;
      color: #fff4b8;
      font-size: clamp(1rem, 2.4vw, 1.35rem);
      font-weight: 750;
      line-height: 1.35;
    }

    .warning strong { color: #ffdf42; }

    .signal {
      width: min(72vw, 72vh, 720px);
      height: min(72vw, 72vh, 720px);
      min-height: 240px;
    }

    .signal > svg { width: 100%; height: 100%; display: block; }

    .details {
      margin: 0;
      color: #b8c2cc;
      font-size: clamp(0.9rem, 2vw, 1.1rem);
    }

    @media (max-height: 700px) {
      .warning { padding: 0.65rem 0.9rem; font-size: 0.95rem; }
      .signal { width: min(58vw, 58vh); height: min(58vw, 58vh); }
    }
  </style>
</head>
<body>
  <aside class="warning" role="alert">
    <strong>Screen-test warning:</strong>
    Timing estimation and automatic color selection is
    unreliable when decoding from screen. Use a real LED for
    representative testing.
  </aside>
